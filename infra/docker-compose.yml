version: "3.9"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: travel_nginx
    ports:
      - "80:80"
      - "8000:8000"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/var/www/frontend/dist:ro
      - ../backend:/var/www/backend
    depends_on:
      - php-fpm
      - node
    networks:
      - app_network

  php-fpm:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: travel_php
    working_dir: /var/www/backend
    volumes:
      - ../backend:/var/www/backend
    depends_on:
      - mongodb
    networks:
      - app_network

  node:
    image: node:20-alpine
    container_name: travel_node
    working_dir: /app
    command: sh -c "npm install && npm run build"
    volumes:
      - ../frontend:/app
    networks:
      - app_network

  mongodb:
    image: mongo:6
    container_name: travel_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

volumes:
  mongo_data:

networks:
  app_network:
    driver: bridge
