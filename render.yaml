services:
  - type: web
    name: travel-management-backend
    runtime: docker
    rootDir: backend
    plan: starter
    envVars:
      - key: APP_NAME
        value: Travel Management
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: "3600"
      - key: PAYMENT_SELF_CONFIRM_ENABLED
        value: "false"
      - key: BANK_TRANSFER_WEBHOOK_SECRET
        sync: false
      - key: MONGODB_URI
        sync: false

  - type: web
    name: travel-management-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: Travel Management
      - key: VITE_API_URL
        sync: false
      - key: VITE_STORAGE_KEY
        value: travel_management_auth

  - type: web
    name: travel-management-frontend-7az8
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_APP_NAME
        value: Travel Management
      - key: VITE_API_URL
        value: https://travel-management-backend-7az8.onrender.com/api
      - key: VITE_STORAGE_KEY
        value: travel_management_auth
